<style>
:root{
  --bg:#E8EDF1; --panel:#FFFFFF; --ink:#14233A; --muted:#566779; --line:#C9D3DC;
  --ox:#B8325A; --ox-soft:#F8E3EA; --red:#0F7C75; --red-soft:#DCF1EE;
  --e:#D99A00; --e-soft:#FFF1C7; --ok:#1D7A3A; --ok-soft:#E1F3E6; --bad:#B3261E; --bad-soft:#FBE4E2;
  --focus:#2F6FEB;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1720; --panel:#17222D; --ink:#E4ECF3; --muted:#9AAABA; --line:#2B3A48;
    --ox:#F27D9C; --ox-soft:#3A1E28; --red:#4CC7BC; --red-soft:#143331;
    --e:#FFC933; --e-soft:#3A3013; --ok:#6CD58C; --ok-soft:#16301F; --bad:#FF8A80; --bad-soft:#3B1D1B; --focus:#7FA8FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1720; --panel:#17222D; --ink:#E4ECF3; --muted:#9AAABA; --line:#2B3A48;
  --ox:#F27D9C; --ox-soft:#3A1E28; --red:#4CC7BC; --red-soft:#143331;
  --e:#FFC933; --e-soft:#3A3013; --ok:#6CD58C; --ok-soft:#16301F; --bad:#FF8A80; --bad-soft:#3B1D1B; --focus:#7FA8FF;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;line-height:1.15;margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
sub,sup{font-size:.68em;line-height:0}
main{max-width:820px;margin:0 auto;padding:1rem 1rem 3rem}

/* start */
.hero{padding:2rem 0 1rem}
.hero h1{font-size:clamp(2.4rem,8vw,4.2rem);font-weight:800;letter-spacing:-.02em}
.hero p{margin:.5rem 0 0;color:var(--muted);max-width:34em}
.hop{display:block;width:100%;max-width:520px;height:auto;margin:1.2rem 0 .2rem}
.hop .atom{fill:var(--panel);stroke:var(--line);stroke-width:2;transform-box:fill-box;transform-origin:center}
.hop .atom.zn{transform:scale(.62)}
.hop .lbl{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;fill:var(--ink)}
.hop .lbl.small{font-size:20px}
.hop .start{opacity:0}
.hop .elec{fill:var(--e);opacity:0}
.hop .arc{fill:none;stroke:var(--e);stroke-width:2.5;stroke-dasharray:6 5}
.hop .arrowhead{fill:var(--e)}
.hop .etxt{font-weight:700;font-size:17px;fill:var(--ink)}
.hop .cap{font-size:16px;font-weight:700}
.hop .cap.ox{fill:var(--ox)} .hop .cap.red{fill:var(--red)}
.hop.play .atom.zn{animation:shrink 4.4s ease both}
.hop.play .atom.cu{animation:grow 4.4s ease both}
.hop.play .start{animation:out 4.4s both}
.hop.play .end{animation:in 4.4s both}
.hop.play .after{animation:after 4.4s both}
.hop.play .e1{animation:hop1 4.4s cubic-bezier(.45,0,.35,1) both}
.hop.play .e2{animation:hop2 4.4s cubic-bezier(.45,0,.35,1) both}
@keyframes shrink{0%,50%{transform:scale(1)}68%,100%{transform:scale(.62)}}
@keyframes grow{0%,52%{transform:scale(.62)}72%,100%{transform:scale(1)}}
@keyframes out{0%,54%{opacity:1}64%,100%{opacity:0}}
@keyframes in{0%,58%{opacity:0}70%,100%{opacity:1}}
@keyframes after{0%,74%{opacity:0}88%,100%{opacity:1}}
@keyframes hop1{0%,14%{transform:translate(-230px,0);opacity:1}29%{transform:translate(-115px,-48px);opacity:1}44%{transform:translate(0,0);opacity:1}62%{transform:translate(0,0);opacity:1}72%,100%{transform:translate(0,0);opacity:0}}
@keyframes hop2{0%,21%{transform:translate(-210px,0);opacity:1}36%{transform:translate(-105px,-44px);opacity:1}51%{transform:translate(0,0);opacity:1}64%{transform:translate(0,0);opacity:1}74%,100%{transform:translate(0,0);opacity:0}}
@media (prefers-reduced-motion: reduce){.hop.play *{animation:none!important}}
.replay{margin:0 0 .3rem}
.pick h2{font-size:1.25rem;margin:1.6rem 0 .6rem}
.tiles{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.tile{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:.9rem 1rem}
.tile b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:1.2rem}
.tile span{color:var(--muted);font-size:.95rem}
.tile[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tile small{display:block;margin-top:.35rem;color:var(--muted)}
.reset{margin-top:1.4rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;color:var(--muted)}
.go{margin-top:1.6rem;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:.85rem 2rem;font-weight:700;font-size:1.1rem}

/* task */
.bar{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between;padding:.4rem 0 1rem;border-bottom:1px solid var(--line)}
.bar .where{font-weight:700}
.bar .stats{display:flex;gap:1rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar .stats b{color:var(--ink)}
.link{background:none;border:0;padding:.3rem 0;text-decoration:underline;text-underline-offset:3px;color:var(--muted)}
.ctx{font-size:1.12rem;margin:1.2rem 0 .3rem;max-width:40em}
details.sheet{margin:.6rem 0 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.5rem .9rem}
details.sheet summary{cursor:pointer;font-weight:700}
details.sheet ul{margin:.5rem 0 .3rem;padding-left:1.2rem}
.step{margin-top:1.6rem;padding-top:1.1rem;border-top:1px dashed var(--line)}
.step.later{opacity:.45}
.step h2{font-size:1.25rem;display:flex;gap:.6rem;align-items:baseline}
.step h2 .n{display:inline-grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--ink);color:var(--bg);font-size:.95rem;flex:none}
.step.solved h2 .n{background:var(--ok)}
.step .intro{color:var(--muted);margin:.35rem 0 .8rem}

.eq{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:.7rem .8rem;margin-bottom:.8rem}
.eq.is-ox{border-left-color:var(--ox)} .eq.is-red{border-left-color:var(--red)}
.eqhead{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.eqhead .t{font-weight:700}
.lab{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lab button{border:0;background:transparent;padding:.3rem .8rem;font-size:.95rem}
.lab button[aria-pressed="true"].ox{background:var(--ox);color:#fff}
.lab button[aria-pressed="true"].red{background:var(--red);color:#fff}
.lab button:disabled{cursor:default}
.lab button[aria-pressed="true"].neutral{background:var(--ink);color:var(--bg)}
.eqrow{display:grid;grid-template-columns:1fr auto 1fr;gap:.4rem;align-items:stretch}
.arrow{align-self:center;font-size:1.5rem;color:var(--muted);padding:0 .1rem}
.side{min-height:3.2rem;border:2px dashed var(--line);border-radius:10px;padding:.35rem;display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;cursor:pointer}
.side.active{border-style:solid;border-color:var(--ink);background:color-mix(in srgb,var(--ink) 5%,transparent)}
.side.locked{cursor:default;border-style:solid}
.ph{color:var(--muted);font-size:.9rem;padding:0 .3rem}
.plus{color:var(--muted);font-weight:700}
.term{display:inline-flex;align-items:center;gap:.1rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.1rem .2rem;white-space:nowrap}
.term.is-e{background:var(--e-soft);border-color:var(--e)}
.term .coef{min-width:1.1em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.term .coef.one{color:var(--muted);font-weight:400}
.term .sp{font-size:1.1rem;padding:0 .2rem}
.cbtn,.rm{border:0;background:transparent;width:1.7rem;height:1.7rem;border-radius:6px;font-weight:700;color:var(--muted)}
.cbtn:hover,.rm:hover{background:var(--line);color:var(--ink)}
.cbtn:disabled{opacity:.25;cursor:default;background:transparent}
.term.fixed{padding-right:.45rem}
.pool{display:flex;flex-wrap:wrap;gap:.45rem;margin:.3rem 0 .8rem}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:.35rem .8rem;font-size:1.15rem;min-width:3rem}
.chip:hover{border-color:var(--ink)}
.chip.is-e{background:var(--e-soft);border-color:var(--e)}
.poolhint{font-size:.9rem;color:var(--muted);margin:.2rem 0 0}

.factors{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:.8rem}
.fac{background:var(--panel);border:1px solid var(--line);border-left:6px solid;border-radius:12px;padding:.7rem .9rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.fac.ox{border-left-color:var(--ox)} .fac.red{border-left-color:var(--red)}
.fac .what{flex:1 1 9em}
.fac .what small{display:block;color:var(--muted)}
.fac input{width:4.2rem;padding:.4rem .5rem;border:2px solid var(--line);border-radius:8px;background:var(--bg);font-size:1.15rem;text-align:center}

.actions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:.5rem 1.3rem;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.fb{margin-top:.8rem;border-radius:10px;padding:.65rem .9rem;border:1px solid}
.fb p{margin:.15rem 0}
.lab.missing,.side.missing,.fac input.missing{outline:3px solid var(--e);outline-offset:2px;background:var(--e-soft);animation:nudge .45s ease 2}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
@media (prefers-reduced-motion: reduce){.lab.missing,.side.missing,.fac input.missing{animation:none}}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb.info{background:var(--e-soft);border-color:var(--e)}
.sol{margin-top:.8rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.65rem .9rem}
.sol .eqtxt{font-size:1.15rem}
.eqtxt .e{background:var(--e-soft);border-radius:4px;padding:0 .15em}
.done{margin-top:1.8rem;padding:1rem;border-radius:14px;background:var(--panel);border:2px solid var(--ok)}
.done h3{font-size:1.2rem;margin-bottom:.4rem}

<script id="logic">
// ---------- Teilchen & Chemie ----------
function parseSp(key){
  if(key==='e') return {el:{},q:-1};
  const m=key.match(/^(.*?)(\d*)([+-])$/);
  let body=key,q=0;
  if(m){body=m[1];q=(m[2]?parseInt(m[2],10):1)*(m[3]==='+'?1:-1);}
  const el={};
  body.replace(/([A-Z][a-z]?)(\d*)/g,(_,s,n)=>{el[s]=(el[s]||0)+(n?parseInt(n,10):1);return '';});
  return {el,q};
}
function fmt(key){
  if(key==='e') return 'e<sup>−</sup>';
  const m=key.match(/^(.*?)(\d*)([+-])$/);
  let body=key,ch='';
  if(m){body=m[1];ch=(m[2]||'')+(m[3]==='+'?'+':'−');}
  return body.replace(/(\d+)/g,'<sub>$1</sub>')+(ch?'<sup>'+ch+'</sup>':'');
}
const gcd=(a,b)=>b?gcd(b,a%b):a;
const lcm=(a,b)=>a/gcd(a,b)*b;
function mainEl(a,b){const ea=parseSp(a).el,eb=parseSp(b).el;return Object.keys(ea).find(x=>eb[x]);}
function half(R,P){
  const x=mainEl(R,P),pr=parseSp(R),pp=parseSp(P);
  const cR=pr.el[x],cP=pp.el[x],g=gcd(cR,cP),a=cP/g,b=cR/g;
  const d=b*pp.q-a*pr.q;
  const eq={L:{[R]:a},R:{[P]:b}};
  if(d>0) eq.R.e=d; else eq.L.e=-d;
  return {eq,n:Math.abs(d),type:d>0?'ox':'red',a,b};
}
function reduceEq(E){
  const vals=[...Object.values(E.L),...Object.values(E.R)];
  const g=vals.reduce((x,y)=>gcd(x,y));
  const f=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,v/g]));
  return {L:f(E.L),R:f(E.R)};
}
function solve(rx){
  const ox=half(rx.m,rx.mP),red=half(rx.o,rx.oP);
  const L=lcm(ox.n,red.n),fo=L/ox.n,fr=L/red.n;
  const ionic=reduceEq({L:{[rx.m]:fo*ox.a,[rx.o]:fr*red.a},R:{[rx.mP]:fo*ox.b,[rx.oP]:fr*red.b}});
  const forms=[ionic];
  if(rx.salt){
    const x=mainEl(rx.mP,rx.salt);
    const k=ionic.R[rx.mP]/parseSp(rx.salt).el[x];
    forms.push(reduceEq({L:{...ionic.L},R:{[rx.salt]:k}}));
  }
  return {ox:ox.eq,red:red.eq,nOx:ox.n,nRed:red.n,L,fo,fr,forms};
}
function keysOf(o){return Object.keys(o).filter(k=>o[k]>0);}
function eqEqual(A,B){
  return ['L','R'].every(s=>{const ka=keysOf(A[s]),kb=keysOf(B[s]);return ka.length===kb.length&&ka.every(k=>A[s][k]===B[s][k]);});
}
function tally(E){
  const res={L:{el:{},q:0},R:{el:{},q:0}};
  for(const s of ['L','R']) for(const [k,c] of Object.entries(E[s])){
    const p=parseSp(k);res[s].q+=c*p.q;
    for(const [x,n] of Object.entries(p.el)) res[s].el[x]=(res[s].el[x]||0)+c*n;
  }
  return res;
}

// ---------- Aufgaben ----------
const REACTIONS=[
  // Stufe 1
  {id:'zn-cu',lvl:1,m:'Zn',mP:'Zn2+',o:'Cu2+',oP:'Cu',text:'Ein Zinkblech wird in blaue Kupfer(II)-sulfat-Lösung getaucht. Auf dem Blech scheidet sich rotbraunes Kupfer ab.'},
  {id:'fe-cu',lvl:1,m:'Fe',mP:'Fe2+',o:'Cu2+',oP:'Cu',text:'Ein Eisennagel liegt in Kupfer(II)-sulfat-Lösung. Er überzieht sich mit Kupfer, dabei gehen Eisen(II)-Ionen in Lösung.'},
  {id:'mg-zn',lvl:1,m:'Mg',mP:'Mg2+',o:'Zn2+',oP:'Zn',text:'Magnesiumspäne werden in Zinksulfat-Lösung gegeben. Auf den Spänen bildet sich ein grauer Zinküberzug.'},
  {id:'mg-cl',lvl:1,m:'Mg',mP:'Mg2+',o:'Cl2',oP:'Cl-',salt:'MgCl2',text:'Ein brennendes Magnesiumband wird in einen Standzylinder mit Chlorgas gehalten. Es entsteht weißes Magnesiumchlorid.'},
  {id:'zn-s',lvl:1,m:'Zn',mP:'Zn2+',o:'S',oP:'S2-',salt:'ZnS',text:'Ein Gemisch aus Zinkpulver und Schwefel reagiert nach dem Zünden heftig zu Zinksulfid.'},
  {id:'fe-s',lvl:1,m:'Fe',mP:'Fe2+',o:'S',oP:'S2-',salt:'FeS',text:'Eisenpulver und Schwefel glühen nach kurzem Erhitzen von selbst weiter. Es entsteht Eisen(II)-sulfid.'},
  {id:'na-cl',lvl:1,m:'Na',mP:'Na+',o:'Cl2',oP:'Cl-',salt:'NaCl',text:'Natrium verbrennt in Chlorgas mit gelber Flamme zu Natriumchlorid, also Kochsalz.'},
  {id:'cu-ag',lvl:1,m:'Cu',mP:'Cu2+',o:'Ag+',oP:'Ag',text:'Ein Kupferdraht hängt in Silbernitrat-Lösung. Es wächst ein glitzernder „Silberbaum“, und die Lösung färbt sich durch Kupfer(II)-Ionen blau.'},
  // Stufe 2
  {id:'mg-o',lvl:2,m:'Mg',mP:'Mg2+',o:'O2',oP:'O2-',salt:'MgO',text:'Magnesium verbrennt mit grellweißem Licht zu Magnesiumoxid. Deshalb steckt es in Wunderkerzen und Feuerwerk.'},
  {id:'ca-o',lvl:2,m:'Ca',mP:'Ca2+',o:'O2',oP:'O2-',salt:'CaO',text:'Frisch angeschnittenes Calcium reagiert an der Luft mit Sauerstoff zu Calciumoxid.'},
  {id:'k-br',lvl:2,m:'K',mP:'K+',o:'Br2',oP:'Br-',salt:'KBr',text:'Kalium reagiert sehr heftig mit Brom zu Kaliumbromid.'},
  {id:'li-o',lvl:2,m:'Li',mP:'Li+',o:'O2',oP:'O2-',salt:'Li2O',text:'Lithium, das Metall aus Akkus, reagiert mit Sauerstoff zu Lithiumoxid.'},
  {id:'zn-ag',lvl:2,m:'Zn',mP:'Zn2+',o:'Ag+',oP:'Ag',text:'Ein Zinkblech steht in Silbernitrat-Lösung. Silber scheidet sich ab, Zink-Ionen gehen in Lösung.'},
  {id:'mg-ag',lvl:2,m:'Mg',mP:'Mg2+',o:'Ag+',oP:'Ag',text:'Ein Magnesiumband in Silbernitrat-Lösung überzieht sich mit Silber. Magnesium-Ionen gehen in Lösung.'},
  {id:'na-s',lvl:2,m:'Na',mP:'Na+',o:'S',oP:'S2-',salt:'Na2S',text:'Natrium und Schwefel reagieren zu Natriumsulfid.'},
  {id:'ca-cl',lvl:2,m:'Ca',mP:'Ca2+',o:'Cl2',oP:'Cl-',salt:'CaCl2',text:'Calcium reagiert mit Chlorgas zu Calciumchlorid, einem Salz, das im Winter auch als Streusalz dient.'},
  // Stufe 3
  {id:'al-cl',lvl:3,m:'Al',mP:'Al3+',o:'Cl2',oP:'Cl-',salt:'AlCl3',distract:['Cl','Al2+','AlCl2'],text:'Aluminiumfolie glüht in Chlorgas auf. Es entsteht Aluminiumchlorid.'},
  {id:'al-o',lvl:3,m:'Al',mP:'Al3+',o:'O2',oP:'O2-',salt:'Al2O3',distract:['O','O-','AlO'],text:'Aluminium überzieht sich an der Luft sofort mit einer dünnen, schützenden Schicht aus Aluminiumoxid.'},
  {id:'fe-cl',lvl:3,m:'Fe',mP:'Fe3+',o:'Cl2',oP:'Cl-',salt:'FeCl3',distract:['Fe2+','Cl','FeCl2'],text:'Glühende Eisenwolle reagiert mit Chlorgas. Es entsteht Eisen(III)-chlorid.'},
  {id:'al-cu',lvl:3,m:'Al',mP:'Al3+',o:'Cu2+',oP:'Cu',distract:['Cu+','Al+'],text:'Aluminiumfolie in Kupfer(II)-chlorid-Lösung löst sich auf, rotbraunes Kupfer scheidet sich ab.'},
  {id:'al-br',lvl:3,m:'Al',mP:'Al3+',o:'Br2',oP:'Br-',salt:'AlBr3',distract:['Br','Al+','AlBr'],text:'Aluminium und Brom reagieren unter Funkensprühen zu Aluminiumbromid.'},
  {id:'fe-o',lvl:3,m:'Fe',mP:'Fe3+',o:'O2',oP:'O2-',salt:'Fe2O3',distract:['Fe2+','O','FeO'],text:'Beim Rosten reagiert Eisen (vereinfacht) mit Sauerstoff zu Eisen(III)-oxid.'},
  {id:'mg-fe',lvl:3,m:'Mg',mP:'Mg2+',o:'Fe3+',oP:'Fe',distract:['Fe2+','Mg+'],text:'Magnesiumpulver wird in Eisen(III)-chlorid-Lösung gegeben. Es scheidet sich Eisen ab.'},
  {id:'al-ag',lvl:3,m:'Al',mP:'Al3+',o:'Ag+',oP:'Ag',distract:['Ag2+','Al2+'],text:'Aluminium in Silbernitrat-Lösung: Es bilden sich Aluminium-Ionen, und Silber scheidet sich ab.'},
  {id:'al-zn',lvl:3,m:'Al',mP:'Al3+',o:'Zn2+',oP:'Zn',distract:['Zn+','Al+'],text:'Aluminium verdrängt Zink aus einer Zinksulfat-Lösung.'}
];

<script>
// ---------- Zustand ----------
const LEVELS={
  1:{name:'Stufe 1',title:'Grundlagen',desc:'Die Teilchen stehen schon da. Du ergänzt Elektronen und Koeffizienten.'},
  2:{name:'Stufe 2',title:'Aufbau',desc:'Du setzt die Gleichungen selbst aus Teilchen zusammen.'},
  3:{name:'Stufe 3',title:'Profi',desc:'Aluminium, Eisen(III) und mehr – mit Fallen im Teilchen-Vorrat.'}
};
const TEST_LEN=5;
const STEP_MAX={1:40,2:20,3:40};
let S={screen:'start',mode:'learn',level:1};
let timerId=null;

const $app=document.getElementById('app');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pts=s=>s>0?'+'+s:(s<0?'−'+(-s):'±0');

function loadHS(){try{return JSON.parse(localStorage.getItem('redox-werkstatt-hs-v2')||'{}')||{};}catch(e){return {};}}
function saveHS(h){try{localStorage.setItem('redox-werkstatt-hs-v2',JSON.stringify(h));}catch(e){}}

function startSession(){
  const pool=REACTIONS.filter(r=>r.lvl===S.level);
  S.screen='task';
  S.points=0; S.idx=0;
  if(S.mode==='test'){
    S.tasks=shuffle(pool).slice(0,TEST_LEN);
    S.t0=Date.now(); startTimer();
  }else{
    S.tasks=shuffle(pool); stopTimer();
  }
  loadTask();
}
function loadTask(){
  if(S.mode==='learn' && S.idx>=S.tasks.length){S.tasks=shuffle(S.tasks);S.idx=0;}
  const rx=S.tasks[S.idx];
  S.rx=rx; S.sol=solve(rx);
  S.step=1; S.done={}; S.att={1:0,2:0,3:0}; S.hint={1:0,2:0,3:0}; S.fb={}; S.revealed={}; S.taskPts=0;
  S.fac={fo:'',fr:''};S.missing={};S.gForm='ion';S.pen={1:0,2:0,3:0};
  const blank=()=>({L:[],R:[],label:null});
  S.b={t0:blank(),t1:blank(),g:{L:[],R:[]}};
  if(S.level===1){
    const halves=shuffle([[rx.m,rx.mP],[rx.o,rx.oP]]);
    halves.forEach((h,i)=>{S.b['t'+i].L=[{sp:h[0],c:1,fixed:true}];S.b['t'+i].R=[{sp:h[1],c:1,fixed:true}];});
    S.b.g.L=[{sp:rx.m,c:1,fixed:true},{sp:rx.o,c:1,fixed:true}];S.b.g.R=[{sp:rx.mP,c:1,fixed:true},{sp:rx.oP,c:1,fixed:true}];
  }
  const base=[rx.m,rx.o,rx.mP,rx.oP];
  const dis=S.level===3?(rx.distract||[]):[];
  if(S.level===1){S.pool1=['e'];S.pool3=['e'];}
  else{
    S.pool1=shuffle([...base,'e',...dis,...(S.level===3&&rx.salt?[rx.salt]:[])]);
    S.pool3=shuffle([...base,'e',...(rx.salt?[rx.salt]:[]),...dis]);
  }
  S.active={id:'t0',side:'L'};
  render();
  window.scrollTo({top:0});
}
function startTimer(){stopTimer();timerId=setInterval(()=>{const el=document.getElementById('timer');if(el) el.textContent=clock(Date.now()-S.t0);},1000);}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function clock(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

// ---------- Auswertung ----------
function toEq(b){
  const f=list=>{const o={};list.forEach(t=>{o[t.sp]=(o[t.sp]||0)+t.c;});return o;};
  return {L:f(b.L),R:f(b.R)};
}
function signed(q){return q>0?'+'+q:(q<0?'−'+(-q):'0');}
function distractMsg(sp){
  const p=parseSp(sp),els=Object.keys(p.el);
  if(p.q===0&&els.length===1&&p.el[els[0]]===1&&['Cl','Br','O','I'].includes(sp))
    return `${fmt(sp)} kommt als einzelnes Atom nicht vor. Das Element liegt als Molekül ${fmt(sp+'2')} vor.`;
  if(els.length>1) return `Die Formel ${fmt(sp)} passt nicht zu den Ionen, die hier entstehen. Prüfe die Ionenladungen.`;
  if(sp.startsWith('Fe')) return 'Lies den Aufgabentext genau: Welche Eisen-Ionen kommen hier vor?';
  return `${fmt(sp)} kommt in dieser Reaktion nicht vor. Welche Ladung hat das Ion wirklich? Nutze das Periodensystem und den Aufgabentext.`;
}
function balanceMsg(E){
  const t=tally(E);
  const els=new Set([...Object.keys(t.L.el),...Object.keys(t.R.el)]);
  for(const x of els){const l=t.L.el[x]||0,r=t.R.el[x]||0;
    if(l!==r) return `Die Atome sind nicht ausgeglichen: ${x} links ${l}, rechts ${r}.`;}
  if(t.L.q!==t.R.q) return `Die Ladungen sind nicht ausgeglichen: links ${signed(t.L.q)}, rechts ${signed(t.R.q)}.`;
  return null;
}
function analyzeTeil(E,label){
  const rx=S.rx,sol=S.sol;
  const kL=keysOf(E.L),kR=keysOf(E.R),all=[...kL,...kR];
  if(!kL.length||!kR.length) return {ok:false,msg:'Beide Seiten brauchen mindestens ein Teilchen.'};
  for(const sp of all) if((rx.distract||[]).includes(sp)) return {ok:false,msg:distractMsg(sp)};
  if(rx.salt&&all.includes(rx.salt)) return {ok:false,msg:`Salzformeln wie ${fmt(rx.salt)} gehören nicht in Teilgleichungen. Hier betrachtest du Atome und Ionen einzeln.`};
  const eL=E.L.e||0,eR=E.R.e||0;
  if(eL&&eR) return {ok:false,msg:'Elektronen stehen nur auf einer Seite der Teilgleichung.'};
  const nonE=all.filter(s=>s!=='e');
  const isOx=nonE.some(s=>s===rx.m||s===rx.mP),isRed=nonE.some(s=>s===rx.o||s===rx.oP);
  if(isOx&&isRed) return {ok:false,msg:'Eine Teilgleichung beschreibt nur einen Stoff und das Teilchen, das daraus wird. Trenne Oxidation und Reduktion.'};
  const target=isOx?'ox':'red';
  const [reac,prod]=isOx?[rx.m,rx.mP]:[rx.o,rx.oP];
  const nL=kL.filter(s=>s!=='e'),nR=kR.filter(s=>s!=='e');
  if(nL.includes(prod)||nR.includes(reac)) return {ok:false,target,msg:'Links steht der Ausgangsstoff, rechts das Teilchen, das daraus entsteht.'};
  if(!nL.includes(reac)) return {ok:false,target,msg:`Es fehlt der Ausgangsstoff ${fmt(reac)}.`};
  if(!nR.includes(prod)) return {ok:false,target,msg:`Es fehlt das Produkt ${fmt(prod)}.`};
  if(!eL&&!eR) return {ok:false,target,msg:'Es fehlen die Elektronen. Werden hier Elektronen abgegeben oder aufgenommen?'};
  const bm=balanceMsg(E);
  if(bm){
    let extra='';
    if(target==='ox'&&eL) extra=' Tipp: Hier werden Elektronen abgegeben, sie stehen also bei den Produkten.';
    if(target==='red'&&eR) extra=' Tipp: Hier werden Elektronen aufgenommen, sie stehen also bei den Ausgangsstoffen.';
    return {ok:false,target,msg:bm+extra};
  }
  const C=target==='ox'?sol.ox:sol.red;
  if(!eqEqual(E,C)) return {ok:false,target,msg:'Die Gleichung ist ausgeglichen, aber nicht gekürzt. Verwende die kleinstmöglichen Koeffizienten.'};
  if(!label) return {ok:false,eqOk:true,target,msg:'Die Gleichung stimmt. Ordne sie noch zu: Oxidation oder Reduktion?'};
  if(label!==target) return {ok:false,eqOk:true,target,msg:target==='ox'
    ?'Die Gleichung stimmt, aber die Zuordnung nicht: Hier werden Elektronen abgegeben, das ist eine Oxidation.'
    :'Die Gleichung stimmt, aber die Zuordnung nicht: Hier werden Elektronen aufgenommen, das ist eine Reduktion.'};
  return {ok:true,eqOk:true,target};
}
function evalStep1(){
  const r=[0,1].map(i=>analyzeTeil(toEq(S.b['t'+i]),S.b['t'+i].label));
  if(r[0].target&&r[0].target===r[1].target&&r[0].eqOk&&r[1].eqOk){
    r[1]={ok:false,target:r[1].target,msg:'Beide Teilgleichungen beschreiben denselben Vorgang. Es fehlt die andere Hälfte.'};
  }
  return {ok:r[0].ok&&r[1].ok,r};
}
function evalStep2(){
  const fo=parseInt(S.fac.fo,10),fr=parseInt(S.fac.fr,10),{nOx,nRed}=S.sol;
  if(!(fo>=1)||!(fr>=1)) return {ok:false,msg:'Trage für beide Teilgleichungen einen ganzzahligen Faktor ein (mindestens 1).'};
  const a=fo*nOx,b=fr*nRed;
  if(a!==b) return {ok:false,msg:`Abgegeben werden ${fo} · ${nOx} = ${a} e<sup>−</sup>, aufgenommen ${fr} · ${nRed} = ${b} e<sup>−</sup>. Beide Zahlen müssen gleich sein.`};
  if(fo!==S.sol.fo) return {ok:false,msg:`Die Elektronenzahlen sind gleich (${a}), aber es geht kleiner. Nutze das kleinste gemeinsame Vielfache.`};
  return {ok:true,msg:`Abgegeben ${a} e<sup>−</sup>, aufgenommen ${b} e<sup>−</sup>.`};
}
function evalStep3(){
  const rx=S.rx,E=toEq(S.b.g),kL=keysOf(E.L),kR=keysOf(E.R),all=[...kL,...kR];
  if(!kL.length||!kR.length) return {ok:false,msg:'Beide Seiten brauchen mindestens ein Teilchen.'};
  if(all.includes('e')) return {ok:false,msg:'In der Gesamtgleichung stehen keine Elektronen mehr. Sie werden abgegeben und gleich wieder aufgenommen, also gekürzt.'};
  for(const sp of all) if((rx.distract||[]).includes(sp)) return {ok:false,msg:distractMsg(sp)};
  const hasSalt=rx.salt&&all.includes(rx.salt);
  if(hasSalt&&(all.includes(rx.mP)||all.includes(rx.oP))) return {ok:false,msg:`Entscheide dich: entweder die Ionen oder die Salzformel ${fmt(rx.salt)}, nicht beides.`};
  const F=hasSalt?S.sol.forms[1]:S.sol.forms[0];
  const expL=keysOf(F.L),expR=keysOf(F.R);
  if(kL.some(s=>expR.includes(s))||kR.some(s=>expL.includes(s))) return {ok:false,msg:'Links stehen die Ausgangsstoffe, rechts die Produkte.'};
  for(const s of expL) if(!kL.includes(s)) return {ok:false,msg:`Bei den Ausgangsstoffen fehlt ${fmt(s)}.`};
  for(const s of expR) if(!kR.includes(s)) return {ok:false,msg:`Bei den Produkten fehlt ${fmt(s)}.`};
  const bm=balanceMsg(E);
  if(bm) return {ok:false,msg:bm+' Übernimm die Koeffizienten aus den Teilgleichungen, multipliziert mit den Faktoren.'};
  if(!eqEqual(E,F)) return {ok:false,msg:'Die Gleichung ist ausgeglichen, aber nicht gekürzt. Verwende die kleinstmöglichen Koeffizienten.'};
  return {ok:true};
}

// ---------- Aktionen ----------
function locked(id){return id==='g'?(S.step!==3||S.done[3]):(S.step!==1);}
function incomplete(step){
  const miss={};let msg='';
  if(step===1||step===3){
    const ids=step===1?['t0','t1']:['g'];
    ids.forEach(id=>['L','R'].forEach(s=>{if(!S.b[id][s].length) miss['side-'+id+'-'+s]=true;}));
    if(Object.keys(miss).length) msg='Es sind noch nicht alle Seiten der Gleichung gefüllt (gelb markiert).';
    if(step===1){
      const noLab=ids.filter(id=>!S.b[id].label);
      noLab.forEach(id=>miss['lab-'+id]=true);
      if(noLab.length) msg+=(msg?' ':'')+(noLab.length===2?'Beide Teilgleichungen sind':'Eine Teilgleichung ist')+' noch nicht als Oxidation oder Reduktion zugeordnet (gelb markiert).';
    }
  }else{
    ['fo','fr'].forEach(f=>{if(!(parseInt(S.fac[f],10)>=1)) miss[f]=true;});
    if(Object.keys(miss).length) msg='Trage für beide Teilgleichungen einen Faktor ein (gelb markiert).';
  }
  return msg?{miss,msg}:null;
}
function check(step){
  const learn=S.mode==='learn';
  const inc=incomplete(step);
  S.missing=inc?inc.miss:{};
  if(inc){
    let note='';
    if(!learn){const d=STEP_MAX[step]/10;S.pen[step]+=d;note=` Kein Versuch verbraucht, aber −${d} Punkte für diesen Schritt.`;}
    S.fb[step]={type:'info',html:`<p>${inc.msg}${note}</p>`};render();return;}
  S.att[step]++;
  let ok=false,html='';
  if(step===1){
    const res=evalStep1();ok=res.ok;
    if(!ok){
      if(learn) html=res.r.map((x,i)=>x.ok?`<p><b>Teilgleichung ${i+1}:</b> stimmt.</p>`:`<p><b>Teilgleichung ${i+1}:</b> ${x.msg}</p>`).join('');
      else html=res.r.map((x,i)=>{
        if(!S.b['t'+i].label){S.missing['lab-t'+i]=true;return `<p><b>Teilgleichung ${i+1}:</b> Zuordnung fehlt (gelb markiert).</p>`;}
        return `<p><b>Teilgleichung ${i+1}:</b> ${x.ok?'stimmt.':'stimmt noch nicht.'}</p>`;}).join('');
    }
    S._partial1=res.r.filter(x=>x.ok).length;
  }else if(step===2){
    const res=evalStep2();ok=res.ok;html=learn||ok?`<p>${res.msg}</p>`:'<p>Die Faktoren stimmen noch nicht.</p>';
  }else{
    const res=evalStep3();ok=res.ok;html=learn?`<p>${res.msg||''}</p>`:'<p>Die Gesamtgleichung stimmt noch nicht.</p>';
  }
  const maxP=STEP_MAX[step];
  if(ok){
    let msg=step===3?'Gesamtgleichung richtig.':'Richtig.';
    if(!learn){const base=S.att[step]===1?maxP:maxP/2,p=Math.max(0,base-S.pen[step]);S.points+=p;S.taskPts+=p;
      msg+=` ${pts(p)} Punkte${S.pen[step]?` (${base} − ${S.pen[step]} für Lücken)`:''}.`;}
    S.fb[step]={type:'ok',html:`<p><b>${msg}</b></p>`+(step===2?html:'')};
    advance(step);
  }else if(!learn&&S.att[step]>=2){
    let p=0;if(step===1)p=Math.max(0,S._partial1*10-S.pen[1]);
    S.points+=p;S.taskPts+=p;
    S.fb[step]={type:'bad',html:html+`<p><b>Kein Versuch mehr.</b> ${p?pts(p)+' Punkte für die richtige Teilgleichung. ':''}Die Lösung steht unten.</p>`};
    S.revealed[step]=true;advance(step);
  }else{
    S.fb[step]={type:'bad',html:html+(learn?'':'<p>Noch 1 Versuch.</p>')};
  }
  render();
}
function advance(step){
  S.done[step]=true;S.step=step+1;
  if(step===1) setTimeout(()=>{const el=document.getElementById('fo');if(el)el.focus({preventScroll:false});},30);
  if(step===2) S.active={id:'g',side:'L'};
}
function showHint(step){
  const {rx,sol}=S;
  const H={
    1:[`Metallatome geben ihre Außenelektronen ab und werden zu positiv geladenen Ionen. Nichtmetalle und Metall-Ionen nehmen Elektronen auf.`,
       `Die Ionenladung verrät dir die Zahl der Elektronen. Hauptgruppen-Elemente: Schau ins Periodensystem. Bei Eisen und Kupfer steht die Ladung im Namen, z. B. Eisen(III).`,
       `Gerüst: ${fmt(rx.m)} → ${fmt(rx.mP)} + ? e<sup>−</sup> und ${fmt(rx.o)} + ? e<sup>−</sup> → ${fmt(rx.oP)}. Denk an die Atombilanz!`],
    2:[`Die Oxidation gibt ${sol.nOx} e<sup>−</sup> ab, die Reduktion nimmt ${sol.nRed} e<sup>−</sup> auf. Beide Zahlen müssen gleich groß werden.`,
       `Das kleinste gemeinsame Vielfache von ${sol.nOx} und ${sol.nRed} ist ${sol.L}.`],
    3:[`Multipliziere beide Teilgleichungen mit ihrem Faktor, schreibe sie untereinander und addiere sie.`,
       `Die Elektronen stehen jetzt links und rechts gleich oft. Streiche sie.`+(rx.salt?` Die Produkt-Ionen darfst du zur Salzformel ${fmt(rx.salt)} zusammenfassen.`:'')]
  };
  const list=H[step];const i=Math.min(S.hint[step],list.length-1);S.hint[step]++;
  S.fb[step]={type:'info',html:`<p><b>Tipp ${i+1} von ${list.length}:</b> ${list[i]}</p>`};
  render();
}
function reveal(step){
  S.revealed[step]=true;
  S.fb[step]={type:'info',html:'<p>Hier ist die Lösung. Vergleiche sie mit deinem Versuch, bevor du weitermachst.</p>'};
  advance(step);render();
}
function eqHTML(E){
  const side=o=>Object.entries(o).filter(([,c])=>c>0).map(([k,c])=>`${c>1?c+' ':''}${k==='e'?'<span class="e">'+fmt(k)+'</span>':fmt(k)}`).join(' + ');
  return `<span class="eqtxt">${side(E.L)} → ${side(E.R)}</span>`;
}
function solHTML(step){
  const s=S.sol;
  if(step===1) return `<p>Oxidation: ${eqHTML(s.ox)}</p><p>Reduktion: ${eqHTML(s.red)}</p>`;
  if(step===2) return `<p>Oxidation × ${s.fo}, Reduktion × ${s.fr}, dann werden je ${s.L} e<sup>−</sup> übertragen.</p>`;
  return s.forms.map(f=>`<p>${eqHTML(f)}</p>`).join('<p>oder zusammengefasst</p>');
}
function nextTask(){
  S.idx++;
  if(S.mode==='test'&&S.idx>=S.tasks.length){finishTest();return;}
  loadTask();
}
function finishTest(){
  stopTimer();
  S.time=Date.now()-S.t0;
  const hs=loadHS(),prev=hs[S.level];
  S.newBest=!prev||S.points>prev.p||(S.points===prev.p&&S.time<prev.t);
  if(S.newBest){hs[S.level]={p:S.points,t:S.time};saveHS(hs);}
  S.prevBest=prev;S.screen='end';render();window.scrollTo({top:0});
}

// ---------- Darstellung ----------
function render(){
  if(S.screen==='start') $app.innerHTML=startHTML();
  else if(S.screen==='task') $app.innerHTML=taskHTML();
  else $app.innerHTML=endHTML();
}
function startHTML(){
  const hs=loadHS();
  const play=!S.introSeen;S.introSeen=true;
  const lv=[1,2,3].map(l=>`<button class="tile" data-act="level" data-v="${l}" aria-pressed="${S.level===l}"><b>${LEVELS[l].name}: ${LEVELS[l].title}</b><span>${LEVELS[l].desc}</span>${S.mode==='test'&&hs[l]?`<small>Bestwert: ${hs[l].p} von ${TEST_LEN*100} Punkten in ${clock(hs[l].t)}</small>`:''}</button>`).join('');
  return `
  <section class="hero">
    <h1>Redox-Werkstatt</h1>
    <svg class="hop ${play?'play':''}" viewBox="0 0 520 200" role="img" aria-label="Ein Zinkatom gibt zwei Elektronen an ein Kupfer(II)-Ion ab. Dabei entstehen ein Zink-Ion und ein Kupferatom.">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
      <circle class="atom zn" cx="110" cy="100" r="46"/><circle class="atom cu" cx="410" cy="100" r="46"/>
      <text class="lbl start" x="110" y="109" text-anchor="middle">Zn</text>
      <text class="lbl small end" x="110" y="107" text-anchor="middle">Zn²⁺</text>
      <text class="lbl small start" x="410" y="107" text-anchor="middle">Cu²⁺</text>
      <text class="lbl end" x="410" y="109" text-anchor="middle">Cu</text>
      <circle class="elec e1" cx="375" cy="70" r="8"/><circle class="elec e2" cx="365" cy="108" r="8"/>
      <g class="after"><path class="arc" d="M148 68 Q260 8 368 64" marker-end="url(#ah)"/><text class="etxt" x="260" y="30" text-anchor="middle">2 e⁻</text>
      <text class="cap ox" x="110" y="182" text-anchor="middle">Oxidation: gibt 2 e⁻ ab</text>
      <text class="cap red" x="410" y="182" text-anchor="middle">Reduktion: nimmt 2 e⁻ auf</text></g>
    </svg>
    <button class="link replay" data-act="replay">Animation nochmal abspielen</button>
    <p>Elektronen wandern von einem Teilchen zum anderen. Du stellst die Teilgleichungen auf, ordnest Oxidation und Reduktion zu und fasst alles zur Gesamtgleichung zusammen.</p>
  </section>
  <section class="pick">
    <h2>Wie willst du üben?</h2>
    <div class="tiles">
      <button class="tile" data-act="mode" data-v="learn" aria-pressed="${S.mode==='learn'}"><b>Lernen</b><span>Mit Tipps, genauen Rückmeldungen und Lösungen. Ohne Zeitdruck, beliebig viele Aufgaben.</span></button>
      <button class="tile" data-act="mode" data-v="test" aria-pressed="${S.mode==='test'}"><b>Challenge</b><span>${TEST_LEN} Aufgaben, 2 Versuche pro Schritt, Punkte und Zeit. Keine Tipps. Vergessene Felder kosten 10 %.</span></button>
    </div>
    <h2>Schwierigkeit</h2>
    <div class="tiles">${lv}</div>
    <button class="go" data-act="start">${S.mode==='test'?'Challenge starten':'Üben starten'}</button>
    ${Object.keys(hs).length?`<div class="reset">${S.confirmReset
      ?`<span>Alle Bestwerte auf diesem Gerät löschen?</span> <button class="btn ghost" data-act="resetyes">Ja, löschen</button> <button class="link" data-act="resetno">Abbrechen</button>`
      :`<button class="link" data-act="resetask">Bestwerte auf diesem Gerät löschen</button>`}</div>`:(S.resetDone?'<p class="reset">Bestwerte gelöscht.</p>':'')}
  </section>`;
}
function sideHTML(id,side){
  const b=S.b[id],lk=locked(id),act=!lk&&S.active.id===id&&S.active.side===side;
  const inner=b[side].length?b[side].map((t,i)=>(i?'<span class="plus">+</span>':'')+termHTML(id,side,i,t,lk)).join('')
    :`<span class="ph">${side==='L'?'Ausgangsstoffe':'Produkte'}</span>`;
  return `<div class="side ${act?'active':''} ${lk?'locked':''} ${S.missing&&S.missing['side-'+id+'-'+side]?'missing':''}" ${lk?'':`data-act="side" role="button" tabindex="0"`} data-id="${id}" data-side="${side}" aria-label="${side==='L'?'Linke Seite':'Rechte Seite'}${act?', ausgewählt':''}">${inner}</div>`;
}
function termHTML(id,side,i,t,lk){
  const d=`data-id="${id}" data-side="${side}" data-i="${i}"`;
  if(lk) return `<span class="term ${t.sp==='e'?'is-e':''}">${t.c>1?`<span class="coef">${t.c}</span>`:''}<span class="sp">${fmt(t.sp)}</span></span>`;
  const noDec=t.fixed&&t.c===1;
  return `<span class="term ${t.sp==='e'?'is-e':''} ${t.fixed?'fixed':''}"><button class="cbtn" data-act="dec" ${d} aria-label="Koeffizient verringern" ${noDec?'disabled':''}>−</button><span class="coef ${t.c===1?'one':''}">${t.c}</span><button class="cbtn" data-act="inc" ${d} aria-label="Koeffizient erhöhen">+</button><span class="sp">${fmt(t.sp)}</span>${t.fixed?'':`<button class="rm" data-act="rm" ${d} aria-label="Teilchen entfernen">×</button>`}</span>`;
}
function builderHTML(id,title,withLabel){
  const b=S.b[id],lk=locked(id);
  const lab=withLabel?`<div class="lab ${S.missing&&S.missing['lab-'+id]?'missing':''}" role="group" aria-label="Zuordnung">
      <button class="ox" data-act="label" data-id="${id}" data-v="ox" aria-pressed="${b.label==='ox'}" ${lk?'disabled':''}>Oxidation</button>
      <button class="red" data-act="label" data-id="${id}" data-v="red" aria-pressed="${b.label==='red'}" ${lk?'disabled':''}>Reduktion</button></div>`:'';
  const form=(id==='g'&&S.level===1&&S.rx.salt)?`<div class="lab form" role="group" aria-label="Produkte schreiben als">
      <button class="neutral" data-act="form" data-v="ion" aria-pressed="${S.gForm==='ion'}" ${lk?'disabled':''}>Ionen</button>
      <button class="neutral" data-act="form" data-v="salt" aria-pressed="${S.gForm==='salt'}" ${lk?'disabled':''}>Salzformel</button></div>`:'';
  return `<div class="eq ${b.label?'is-'+b.label:''}"><div class="eqhead"><span class="t">${title}</span>${lab}${form}</div>
    <div class="eqrow">${sideHTML(id,'L')}<span class="arrow" aria-hidden="true">⟶</span>${sideHTML(id,'R')}</div></div>`;
}
function poolHTML(list){
  return `<div class="pool">${list.map(sp=>`<button class="chip ${sp==='e'?'is-e':''}" data-act="add" data-sp="${sp}" aria-label="Teilchen ${sp} einsetzen">${fmt(sp)}</button>`).join('')}</div>
  <p class="poolhint">Tippe auf ein Feld in der Gleichung, dann auf ein Teilchen. Nochmal tippen erhöht den Koeffizienten.</p>`;
}
function stepFooter(step){
  const learn=S.mode==='learn',cur=S.step===step;
  let h='';
  if(cur){
    h+=`<div class="actions"><button class="btn" data-act="check" data-v="${step}">Prüfen</button>`;
    if(learn) h+=`<button class="btn ghost" data-act="hint" data-v="${step}">Tipp</button><button class="link" data-act="reveal" data-v="${step}">Lösung zeigen</button>`;
    h+='</div>';
  }
  if(S.fb[step]) h+=`<div class="fb ${S.fb[step].type}" role="status">${S.fb[step].html}</div>`;
  if(S.revealed[step]) h+=`<div class="sol">${solHTML(step)}</div>`;
  return h;
}
function stepHead(step,title,intro){
  const cls=S.done[step]?'solved':(S.step<step?'later':'');
  return `<section class="step ${cls}" aria-disabled="${S.step<step}"><h2><span class="n">${S.done[step]?'✓':step}</span>${title}</h2>${S.step>=step?`<p class="intro">${intro}</p>`:''}`;
}
function taskHTML(){
  const {rx,sol}=S,learn=S.mode==='learn';
  const stats=learn?`<div class="stats"><span>Aufgabe <b>${S.idx+1}</b></span></div>`
    :`<div class="stats"><span>Aufgabe <b>${S.idx+1}</b> von ${S.tasks.length}</span><span><b>${S.points}</b> Punkte</span><span id="timer">${clock(Date.now()-S.t0)}</span></div>`;
  let h=`<header class="bar"><button class="link" data-act="home">Zur Übersicht</button><span class="where">${learn?'Lernen':'Challenge'}, ${LEVELS[S.level].name}</span>${stats}</header>`;
  h+=`<p class="ctx">${rx.text}</p>`;
  if(learn) h+=`<details class="sheet"><summary>Spickzettel</summary><ul>
    <li><b>Oxidation</b> = Elektronenabgabe. Die Elektronen stehen rechts.</li>
    <li><b>Reduktion</b> = Elektronenaufnahme. Die Elektronen stehen links.</li>
    <li>Jede Teilgleichung muss Atome <i>und</i> Ladungen ausgleichen.</li>
    <li>Abgegebene und aufgenommene Elektronen müssen gleich viele sein: kleinstes gemeinsames Vielfaches.</li></ul></details>`;
  // Schritt 1
  h+=stepHead(1,'Teilgleichungen aufstellen und zuordnen',S.level===1?'Ergänze Elektronen und Koeffizienten. Ordne dann jede Teilgleichung zu.':'Baue beide Teilgleichungen aus den Teilchen. Ordne dann jede zu.');
  h+=builderHTML('t0','Teilgleichung 1',true)+builderHTML('t1','Teilgleichung 2',true);
  if(S.step===1) h+=poolHTML(S.pool1);
  h+=stepFooter(1)+'</section>';
  // Schritt 2
  h+=stepHead(2,'Elektronen ausgleichen','Mit welchem Faktor musst du jede Teilgleichung multiplizieren, damit gleich viele Elektronen abgegeben wie aufgenommen werden?');
  if(S.step>=2){
    const dis=S.step>2?'disabled':'';
    h+=`<div class="factors">
      <label class="fac ox"><span class="what">Oxidation<small>gibt ${sol.nOx} e<sup>−</sup> ab</small></span><span aria-hidden="true">×</span><input id="fo" type="number" inputmode="numeric" min="1" max="12" value="${S.step>2&&S.revealed[2]?sol.fo:S.fac.fo}" class="${S.missing.fo?'missing':''}" data-f="fo" ${dis} aria-label="Faktor Oxidation"></label>
      <label class="fac red"><span class="what">Reduktion<small>nimmt ${sol.nRed} e<sup>−</sup> auf</small></span><span aria-hidden="true">×</span><input type="number" inputmode="numeric" min="1" max="12" value="${S.step>2&&S.revealed[2]?sol.fr:S.fac.fr}" class="${S.missing.fr?'missing':''}" data-f="fr" ${dis} aria-label="Faktor Reduktion"></label></div>`;
    h+=stepFooter(2);
  }
  h+='</section>';
  // Schritt 3
  h+=stepHead(3,'Gesamtgleichung aufstellen','Addiere die Teilgleichungen mit ihren Faktoren und kürze die Elektronen heraus.'+(S.level===1&&S.rx.salt?' Oben rechts wählst du, ob du die Produkte als Ionen oder als Salzformel schreibst.':''));
  if(S.step>=3){
    h+=builderHTML('g','Gesamtgleichung',false);
    if(!S.done[3]) h+=poolHTML(S.pool3);
    h+=stepFooter(3);
  }
  h+='</section>';
  if(S.done[3]){
    const last=S.mode==='test'&&S.idx+1>=S.tasks.length;
    h+=`<div class="done"><h3>${learn?'Aufgabe geschafft.':`Aufgabe fertig: ${S.taskPts} von 100 Punkten.`}</h3>
      <p>${eqHTML(sol.forms[sol.forms.length-1])}</p>
      <div class="actions"><button class="btn" data-act="next">${last?'Auswertung ansehen':'Nächste Aufgabe'}</button></div></div>`;
  }
  return h;
}
function endHTML(){
  const max=S.tasks.length*100,pct=S.points/max;
  const verdict=pct>=.9?'Stark. Die Elektronen-Buchhaltung sitzt.':pct>=.6?'Solide. Schau dir die Schritte an, bei denen du Punkte verloren hast, und übe sie im Lernmodus.':'Da geht noch mehr. Übe im Lernmodus mit Tipps und versuch es dann erneut.';
  return `<header class="bar"><button class="link" data-act="home">Zur Übersicht</button><span class="where">Challenge, ${LEVELS[S.level].name}</span></header>
  <p class="score">${S.points}<small> von ${max} Punkten</small></p>
  <p class="endtxt">Zeit: ${clock(S.time)}. ${verdict}</p>
  <p class="endtxt">${S.newBest?'Neuer Bestwert auf diesem Gerät.':`Dein Bestwert: ${S.prevBest.p} Punkte in ${clock(S.prevBest.t)}.`}</p>
  <div class="actions"><button class="btn" data-act="start">Nochmal</button><button class="btn ghost" data-act="tolearn">Im Lernmodus üben</button></div>`;
}

// ---------- Ereignisse ----------
$app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el) return;
  const a=el.dataset.act,v=el.dataset.v;
  if(a==='mode'){S.mode=v;render();}
  else if(a==='level'){S.level=+v;render();}
  else if(a==='start'){startSession();}
  else if(a==='home'){stopTimer();S.screen='start';render();}
  else if(a==='replay'){S.introSeen=false;render();}
  else if(a==='tolearn'){S.mode='learn';startSession();}
  else if(a==='resetask'){S.confirmReset=true;S.resetDone=false;render();}
  else if(a==='resetno'){S.confirmReset=false;render();}
  else if(a==='resetyes'){try{localStorage.removeItem('redox-werkstatt-hs-v2');}catch(e){}S.confirmReset=false;S.resetDone=true;render();}
  else if(a==='side'){S.active={id:el.dataset.id,side:el.dataset.side};render();}
  else if(a==='add'){
    const ac=S.active;if(!ac||locked(ac.id)) return;
    const list=S.b[ac.id][ac.side],t=list.find(t=>t.sp===el.dataset.sp);
    if(t) t.c=Math.min(12,t.c+1); else list.push({sp:el.dataset.sp,c:1});
    delete S.missing['side-'+ac.id+'-'+ac.side];
    render();
  }
  else if(a==='inc'||a==='dec'||a==='rm'){
    const {id,side}=el.dataset,i=+el.dataset.i;if(locked(id)) return;
    const list=S.b[id][side];
    if(a==='inc') list[i].c=Math.min(12,list[i].c+1);
    else if(a==='dec'){if(list[i].c>1) list[i].c--; else if(!list[i].fixed) list.splice(i,1);}
    else if(!list[i].fixed) list.splice(i,1);
    S.active={id,side};render();
  }
  else if(a==='form'){
    if(locked('g')||S.gForm===v) return;
    const rx=S.rx;S.gForm=v;
    S.b.g.R=v==='salt'?[{sp:rx.salt,c:1,fixed:true}]:[{sp:rx.mP,c:1,fixed:true},{sp:rx.oP,c:1,fixed:true}];
    render();
  }
  else if(a==='label'){const b=S.b[el.dataset.id];b.label=b.label===v?null:v;delete S.missing['lab-'+el.dataset.id];render();}
  else if(a==='check'){check(+v);}
  else if(a==='hint'){showHint(+v);}
  else if(a==='reveal'){reveal(+v);}
  else if(a==='next'){nextTask();}
});
$app.addEventListener('keydown',e=>{
  const el=e.target.closest('.side[data-act]');
  if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.active={id:el.dataset.id,side:el.dataset.side};render();
    const again=$app.querySelector(`.side[data-id="${el.dataset.id}"][data-side="${el.dataset.side}"]`);if(again) again.focus();}
  if(e.target.matches('input[data-f]')&&e.key==='Enter'){e.preventDefault();check(2);}
});
$app.addEventListener('input',e=>{if(e.target.matches('input[data-f]')){S.fac[e.target.dataset.f]=e.target.value;delete S.missing[e.target.dataset.f];e.target.classList.remove('missing');}});

render();
</script>
</body>
</html>
